version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

python:
  install:
    - requirements: requirements.txt

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

# PDF and ePub are only produced for Sphinx projects, so only ask for the
# downloadable HTML archive here.
formats:
  - htmlzip
