name: Check external links

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck-external:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Pinned so a LinkChecker release cannot turn this job red on its own.
      - run: pip install -r requirements.txt linkchecker==10.6.0

      - run: mkdocs build --clean --strict

      # Point at the *.html files rather than at the directory so that local
      # file:// links are not followed and only external targets are checked.
      #
      # --no-warnings matters: LinkChecker exits non-zero on warnings alone, and
      # the site legitimately produces ~30 http-redirected warnings. Without it
      # this job is red every week regardless of whether any link is broken.
      #
      # The canonical URLs are skipped because a freshly built page advertises a
      # readthedocs.io URL that only exists once that version is published, so
      # they 404 for any unreleased change (see Release_Protocol.md).
      - name: Check external links
        run: |
          find site -name '*.html' -print0 | xargs -0 linkchecker -t 1 \
            --check-extern --no-warnings \
            --ignore-url 'file:///.*' \
            --ignore-url 'https://fonts\.gstatic\.com' \
            --ignore-url 'https://dbic-handbook\.readthedocs\.io/.*'
