name: Check external links

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck-external:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt linkchecker

      - run: mkdocs build --clean --strict

      # Point at the *.html files rather than at the directory: that way
      # local file:// links are not followed and only the external targets
      # reachable from every page are checked.
      - name: Check external links
        run: |
          linkchecker -t 1 --check-extern \
            --ignore-url 'file:///.*' \
            --ignore-url 'https://fonts.gstatic.com' \
            site/*.html site/*/*.html
